<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Age verification overlay -->
    <div id="age-verification-overlay" class="age-verification-overlay">
        <div class="age-verification-form">
            <h2>Age Verification</h2>
            <p>This chat application is intended for users 13 years and older. Please enter your age to continue:</p>
            <input type="number" id="age-input" min="1" max="120" placeholder="Enter your age">
            <button id="verify-age-button">Continue</button>
            <p id="age-verification-error" class="age-verification-error">Sorry, you must be at least 13 years old to use this chat application.</p>
        </div>
    </div>

    <h1>Real-time Chat</h1>
    <h2><span id="name"></span></h2>
    <h2>Users</h2>
    <ul id="users"></ul>
    <h2>Add your name</h2>
    <input type="text" id="nameInput" placeholder="Type your name...">
    <button id="setNameButton">Set Name</button>
    <h2>Messages</h2>
    <div id="messages"></div>
    <input type="text" id="messageInput" placeholder="Type a message...">
    <button id="sendButton">Send</button>
    <div id="ai-suggestions" class="ai-suggestions-container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.2.0/socket.io.js"></script>
    <script src="app.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const ageVerificationOverlay = document.getElementById('age-verification-overlay');
            const ageInput = document.getElementById('age-input');
            const verifyAgeButton = document.getElementById('verify-age-button');
            const ageVerificationError = document.getElementById('age-verification-error');
            
            // Check if age has been verified in this session
            if (sessionStorage.getItem('ageVerified') === 'true') {
                ageVerificationOverlay.classList.add('hidden');
            }
            
            verifyAgeButton.addEventListener('click', function() {
                const age = parseInt(ageInput.value, 10);
                
                if (isNaN(age) || age < 1) {
                    ageVerificationError.textContent = 'Please enter a valid age.';
                    ageVerificationError.style.display = 'block';
                } else if (age < 13) {
                    ageVerificationError.textContent = 'Sorry, you must be at least 13 years old to use this chat application.';
                    ageVerificationError.style.display = 'block';
                } else {
                    // Age is valid
                    sessionStorage.setItem('ageVerified', 'true');
                    ageVerificationOverlay.classList.add('hidden');
                }
            });
            
            // Also verify on Enter key press
            ageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    verifyAgeButton.click();
                }
            });
        });
    </script>
</body>
</html>
